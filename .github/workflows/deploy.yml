name: Deploy

# v0.1.0 のようなタグを push したときだけ公開する。
# ふだんは pnpm version patch でバージョンを上げてタグを作り、git push --follow-tags で送る
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のものは打ち切る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 画面に出すバージョン（package.json）と公開のタグがずれないよう、食い違っていたら止める
      - name: タグとバージョンが一致しているか確かめる
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の $version が一致しません"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
