<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- アドレスバーの色。画面上端の帯の背景（src/index.css の --background）と同じにする -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181c2b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="小節ごとに違うリズムやポリリズムを組んで鳴らせるメトロノームです。" />
    <title>Metroloom</title>
    <script>
      // 最初の描画前にテーマを当てて、明るい画面が一瞬見えるのを防ぐ。
      // キーと判定は src/lib/theme.ts と揃えること
      try {
        var stored = localStorage.getItem('metroloom:theme') || 'system'
        var dark =
          stored === 'dark' ||
          (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
